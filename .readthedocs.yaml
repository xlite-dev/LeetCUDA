# Read the Docs 配置：构建时从书稿 tex 现转出站点源树，再交给 Sphinx。
# 站点源树（docs/readthedocs/build/）不入库，tex 是唯一事实源。
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  # dvisvgm 不被 texlive-xetex 自动拉入，必须显式安装；dvisvgm 读 PDF 需要
  # mutool（mupdf-tools，noble 的 ghostscript≥10.01 不再走 GS 路径），
  # pdftocairo/pdftoppm 走 poppler-utils。fonts-dejavu-core 提供书里用的等宽字体。
  apt_packages:
    # 注意：这里**不要**装 pandoc。转换管线用 pip 的 `pypandoc_binary`（自带 pandoc
    # 3.9，见 requirements.txt），而 Ubuntu 24.04 的 apt pandoc 是 3.1.3——`find_pandoc`
    # 会先命中 PATH 上的系统 pandoc，版本一变输出就漂移，post_build 的内容核对会失败。
    - texlive-xetex
    - texlive-latex-recommended
    - texlive-latex-extra
    - texlive-fonts-recommended
    - texlive-pictures
    - texlive-lang-chinese
    - fonts-noto-cjk
    - fonts-dejavu-core
    - dvisvgm
    - mupdf-tools
    - poppler-utils
  jobs:
    pre_build:
      # 书稿 tex → MyST + TikZ → SVG，全部落在 docs/readthedocs/build/。
      # 每进程一份 xelatex，RTD 是 7GB 内存 + 2 并发构建，取 4 较稳。
      # 每条命令前后打时间戳：构建被超时杀掉时，日志最后一行就是卡点。不给这行时
      # sphinx/verify 的输出会被块缓冲吞掉，看起来像「convert 之后再无日志」。
      # 这里一律用 `date +格式` 而不是 `echo "...$(date)"`：RTD 的 jobs 执行链路会把
      # 命令里的引号吃掉（`awk '/Mem:/{print $2}'` 的闭合单引号丢失后 `$(` 永不闭合，
      # 整条 exit 2）。date 的格式串不需要引号，也没有命令替换，绕开这个坑。
      - date -u +pre_build_start:%H:%M:%S
      - cd docs/readthedocs && PYTHONUNBUFFERED=1 python -u -m convert --jobs 4
      - date -u +pre_build_done:%H:%M:%S
    build:
      # 覆盖默认 html 构建：显式指定 srcdir/confdir，避免 srcdir 被当成 conf.py 所在目录
      html:
        - date -u +build_start:%H:%M:%S
        - mkdir -p $READTHEDOCS_OUTPUT/html
        - >-
          PYTHONUNBUFFERED=1 sphinx-build -T -b html
          -d docs/readthedocs/build/doctrees
          -c docs/readthedocs
          docs/readthedocs/build/src
          $READTHEDOCS_OUTPUT/html
        - date -u +build_done:%H:%M:%S
    post_build:
      # 内容核对（章号、表格、属性泄漏、锚点）；不过就让构建失败，避免静默交付错页
      - date -u +post_build_start:%H:%M:%S
      - >-
        cd docs/readthedocs && PYTHONUNBUFFERED=1 python -u -m convert.verify
        --src build/src --html $READTHEDOCS_OUTPUT/html
      - date -u +post_build_done:%H:%M:%S

python:
  install:
    - requirements: docs/readthedocs/requirements.txt

sphinx:
  configuration: docs/readthedocs/conf.py
